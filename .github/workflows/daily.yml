name: Forex paper bot daily run
# Paper-trading simulation only. Weekdays 06:07 UTC (09:07 Istanbul), Nov 23 to Dec 18 2026;
# daily.py does nothing outside that window unless started by hand.
on:
  schedule:
    - cron: "7 6 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forex-paper
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paper run
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python3 forex-paper/daily.py
      - name: Save results
        run: |
          git config user.name "forex-paper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forex-paper/
          git diff --cached --quiet && exit 0
          git commit -m "Paper run $(date -u +%F)"
          for i in 1 2 3 4; do git push && exit 0; git pull --rebase; sleep 5; done
          exit 1
